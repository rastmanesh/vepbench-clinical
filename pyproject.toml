[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vepbench"
version = "0.1.2"
description = "Gene-aware evaluation of variant effect predictors"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy>=1.22", "pandas>=1.5", "scipy>=1.9"]

[project.optional-dependencies]
test = ["scikit-learn>=1.2"]
parquet = ["pyarrow"]

[project.scripts]
vepbench = "vepbench.cli:main"

[tool.setuptools]
packages = ["vepbench"]
